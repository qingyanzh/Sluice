# Minimal enhanced-mode config for scripts/tun-check.sh.
# Run with: sudo ./target/release/sluice run examples/tun-test.conf

[General]
loglevel = info
enhanced-mode = true
api-listen = 127.0.0.1:6170
# Default upstreams for real answers (non-A queries, [Host] lookups, Sluice's own lookups).
encrypted-dns-server = https://1.1.1.1/dns-query, tls://8.8.8.8

[Host]
# Static entries win over fake IPs.
sluice-static.test = 10.9.8.7
# Per-domain upstreams: real answers, one through each encrypted protocol.
example.net = server:https://1.1.1.1/dns-query
iana.org = server:tls://8.8.8.8
wikipedia.org = server:quic://dns.adguard-dns.com

[Rule]
# Proves domain rules work through fake-IP DNS.
DOMAIN,example.org,REJECT
FINAL,DIRECT
