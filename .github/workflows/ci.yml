# Runs on GitHub's macOS runners: fresh VMs with no proxy, i.e. Sluice's target environment.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner image (overrides the CI_RUNNER repository variable)
        type: choice
        options:
          - macos-15
          - macos-14
          - macos-15-intel
          - macos-13
        default: macos-15

jobs:
  build:
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'macos-15' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: sluice
          path: target/release/sluice

  e2e:
    needs: build
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'macos-15' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The app and editor tests use the macOS 26 SDK (glassEffect).
      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: sluice
          path: target/release
      - run: chmod +x target/release/sluice
      - run: brew install shadowsocks-rust xray hysteria
      # build-app.sh also builds the Rust core and Swift helper, resolves Sparkle,
      # embeds the framework and ad-hoc signs the complete app bundle.
      - name: Build app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs/e2e/screenshots
          if ! bash scripts/build-app.sh 2>&1 | tee ci-logs/e2e/build-app.log; then
            echo '::error::App build failed; see ci-logs/e2e/build-app.log'
            exit 1
          fi
          if [[ ! -x dist/Sluice.app/Contents/MacOS/Sluice ]]; then
            echo '::error::App build did not produce dist/Sluice.app/Contents/MacOS/Sluice'
            exit 1
          fi
      - run: bash scripts/ci/e2e.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: ci-logs/e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: ci-logs/e2e/screenshots

  interop:
    needs: build
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'macos-15' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sluice
          path: target/release
      - run: chmod +x target/release/sluice
      - run: brew install shadowsocks-rust xray hysteria simple-obfs v2ray
      - run: brew install sing-box
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      # v2ray-plugin is not in Homebrew; build the upstream server from source.
      - run: go install github.com/shadowsocks/v2ray-plugin@latest && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: bash scripts/ci/interop.sh
      - name: Diagnostics export
        if: always()
        run: bash scripts/ci/diag.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-logs
          path: ci-logs

  tun:
    needs: build
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'macos-15' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sluice
          path: target/release
      - run: chmod +x target/release/sluice
      - run: brew install shadowsocks-rust
      - name: Network before
        run: netstat -rn -f inet | head -15; scutil --nc list || true
      - run: bash scripts/ci/tun.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tun-logs
          path: ci-logs

  misc:
    needs: build
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'macos-15' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sluice
          path: target/release
      - run: chmod +x target/release/sluice
      - name: Rules checks
        run: bash scripts/ci/rules.sh
      - name: MITM checks
        if: ${{ !cancelled() }}
        run: bash scripts/ci/mitm.sh
      - name: Build helper
        id: helper-build
        if: ${{ !cancelled() }}
        run: cd apps/macos && swift build -c release --product SluiceHelper
      - name: Helper checks
        if: ${{ !cancelled() && steps.helper-build.outcome == 'success' }}
        run: bash scripts/ci/helper.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: misc-logs
          path: ci-logs

  subscription:
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'macos-15' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: brew install sing-box
      - run: bash scripts/ci/subscription.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subscription-logs
          path: ci-logs
