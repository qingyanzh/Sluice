# Runs on GitHub's macOS runners: fresh VMs with no proxy, i.e. Sluice's target environment.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: sluice
          path: target/release/sluice

  interop:
    needs: build
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sluice
          path: target/release
      - run: chmod +x target/release/sluice
      - run: brew install shadowsocks-rust xray hysteria simple-obfs v2ray
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      # v2ray-plugin is not in Homebrew; build the upstream server from source.
      - run: go install github.com/shadowsocks/v2ray-plugin@latest && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: bash scripts/ci/interop.sh
      - name: Diagnostics export
        if: always()
        run: bash scripts/ci/diag.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-logs
          path: ci-logs

  tun:
    needs: build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sluice
          path: target/release
      - run: chmod +x target/release/sluice
      - run: brew install shadowsocks-rust
      - name: Network before
        run: netstat -rn -f inet | head -15; scutil --nc list || true
      - run: bash scripts/ci/tun.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tun-logs
          path: ci-logs

  rules:
    needs: build
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sluice
          path: target/release
      - run: chmod +x target/release/sluice
      - run: bash scripts/ci/rules.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rules-logs
          path: ci-logs

  mitm:
    needs: build
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sluice
          path: target/release
      - run: chmod +x target/release/sluice
      - run: bash scripts/ci/mitm.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mitm-logs
          path: ci-logs
