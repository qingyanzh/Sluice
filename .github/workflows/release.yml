# Cuts a GitHub Release from a `v*` tag: universal Sluice.app in a DMG, plus a Sparkle appcast.
# Signing, notarization and appcast signing each run only when their secrets exist (docs/release.md).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  SPARKLE_VERSION: 2.6.4

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
      SPARKLE_ED_PUBLIC_KEY: ${{ vars.SPARKLE_ED_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Version
        run: |
          tag=${GITHUB_REF_NAME}
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
          [[ $tag == *-* ]] && echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV" || true

      - name: Import Developer ID certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          keychain=$RUNNER_TEMP/sign.keychain-db
          pass=$(openssl rand -hex 16)
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)
          [[ -n $identity ]] || { echo "no Developer ID Application identity in MACOS_CERT_P12"; exit 1; }
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build app and DMG
        run: UNIVERSAL=1 scripts/build-dmg.sh

      - name: Notarize and staple
        if: env.SIGN_IDENTITY != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != ''
        run: |
          dmg=dist/Sluice-$VERSION.dmg
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$dmg"
          echo "NOTARIZED=1" >> "$GITHUB_ENV"

      - name: Appcast
        run: |
          dmg=Sluice-$VERSION.dmg
          url=https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$dmg
          if [[ -n $SPARKLE_ED_PRIVATE_KEY ]]; then
            curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz" | tar -xJ -C "$RUNNER_TEMP" ./bin/sign_update
            printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/ed.key"
            enclosure_attrs=$("$RUNNER_TEMP/bin/sign_update" --ed-key-file "$RUNNER_TEMP/ed.key" "dist/$dmg")
            rm "$RUNNER_TEMP/ed.key"
          else
            echo "::warning::SPARKLE_ED_PRIVATE_KEY not set; appcast is unsigned and Sparkle clients will reject it"
            enclosure_attrs="length=\"$(stat -f %z "dist/$dmg")\""
          fi
          cat > dist/appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Sluice</title>
              <item>
                <title>$VERSION</title>
                <pubDate>$(LC_ALL=C date -u "+%a, %d %b %Y %H:%M:%S +0000")</pubDate>
                <link>https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME</link>
                <sparkle:version>$BUILD_NUMBER</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <enclosure url="$url" type="application/octet-stream" $enclosure_attrs/>
              </item>
            </channel>
          </rss>
          XML
          echo "APPCAST_SIGNED=$([[ -n $SPARKLE_ED_PRIVATE_KEY ]] && echo 1)" >> "$GITHUB_ENV"

      - name: Release notes
        run: |
          {
            echo "## 安装"
            echo "下载 \`Sluice-$VERSION.dmg\`，把 Sluice 拖进「应用程序」。通用二进制（Apple Silicon + Intel），需要 macOS 14+。"
            echo
            if [[ -n ${NOTARIZED:-} ]]; then
              echo "已用 Developer ID 签名并通过 Apple 公证。"
            elif [[ -n ${SIGN_IDENTITY:-} ]]; then
              echo "> 已用 Developer ID 签名，但**未公证**。首次打开请右键 → 打开。"
            else
              echo "> ⚠️ 此版本为 **ad-hoc 签名**（未使用 Developer ID，未公证）。首次打开请右键 → 打开，或执行 \`xattr -dr com.apple.quarantine /Applications/Sluice.app\`。"
            fi
            [[ -n ${APPCAST_SIGNED:-} ]] || echo ">"$'\n'"> 自动更新的 appcast 未签名，此版本不能通过「检查更新…」安装。"
          } > dist/notes.md
          cat dist/notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Sluice $VERSION" \
            --notes-file dist/notes.md --generate-notes ${PRERELEASE:-} \
            "dist/Sluice-$VERSION.dmg" dist/appcast.xml
