http-listen = ignored
[Proxy]
Surge-SS = ss, 127.0.0.1, 9, encrypt-method=aes-128-gcm, password=local-surge-password
Surge-AnyTLS = anytls, 127.0.0.1, 9, password=local-surge-anytls
[Rule]
FINAL,NotImported
