[General]
dns-server = 127.0.0.1
[Rule]
DOMAIN,exact.test,DIRECT
DOMAIN-SUFFIX,suffix.test,DIRECT
DOMAIN-KEYWORD,needle,DIRECT
IP-CIDR,127.1.0.0/16,DIRECT,no-resolve
IP-CIDR6,::1/128,DIRECT,no-resolve
PROCESS-NAME,local-check,DIRECT
DST-PORT,8443,DIRECT
IN-PORT,8765,DIRECT
SRC-IP,127.2.0.0/16,DIRECT
PROTOCOL,UDP,DIRECT
URL-REGEX,^http://url\.test/,DIRECT
AND,((DOMAIN,and.test),(DST-PORT,9443)),DIRECT
OR,((DOMAIN,or-a.test),(DOMAIN,or-b.test)),DIRECT
AND,((DOMAIN,not.test),(NOT,((DST-PORT,443)))),DIRECT
RULE-SET,rules.list,DIRECT,no-resolve
DOMAIN-SET,domains.list,DIRECT
FINAL,REJECT
